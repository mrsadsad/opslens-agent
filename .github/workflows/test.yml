name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m opslens demo
      - run: python scripts/verify_archives.py
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: python scripts/verify_release.py --wheel dist/opslens_agent-0.4.0-py3-none-any.whl
