[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opslens-agent"
version = "0.3.1"
description = "Evidence-grounded incident investigation agent and evaluation lab"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opslens = "opslens.__main__:main"

[tool.setuptools.packages.find]
include = ["opslens*"]

[tool.setuptools.package-data]
opslens = ["web/*.html"]
